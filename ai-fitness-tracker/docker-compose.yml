# Local development stack. Copy .env.example to .env before running:
#   docker compose up --build
# Compose reads .env automatically for the ${...} values below.
#
# First run only, once the stack is up:
#   docker compose exec ollama ollama pull <MODEL_NAME>      (model from .env)
#   docker compose exec backend python ingest_docs.py        (load ./docs)

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ defers expansion to the container's own environment.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    # Local LLM server. Models are stored in the ollama_data volume, so they
    # are pulled once and survive restarts. Unpinned tag: pin a version if you
    # need reproducible builds.
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"  # includes pytest so `docker compose exec backend pytest` works
    env_file:
      - .env
    environment:
      # Container paths. These override any values in .env, which can then
      # keep local-run paths without affecting Docker.
      CHROMA_PATH: /data/chroma
      DOCS_DIRECTORY: /docs
    ports:
      - "8000:8000"
    volumes:
      # Development only: live-reload from the host. Remove this mount and
      # the --reload flag for a production deployment.
      - ./backend:/app
      - ./docs:/docs:ro
      - chroma_data:/data/chroma
      # Keeps the downloaded embedding model across container rebuilds.
      - model_cache:/home/appuser/.cache
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      # Ollama is intentionally not a dependency: if it is down the API still
      # starts, /health reports "degraded", and only /ask is unavailable.
    healthcheck:
      # /health returns 503 only when the database is unreachable, which makes
      # urlopen raise and the check fail. A degraded status (Ollama or
      # ChromaDB down) still returns 200 and keeps the container healthy.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    environment:
      # The Streamlit server calls the API from inside the Compose network,
      # so the browser never calls the backend and CORS does not apply here.
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    volumes:
      # Development only: edits on the host reload the app.
      - ./frontend:/app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  ollama_data:
  chroma_data:
  model_cache: