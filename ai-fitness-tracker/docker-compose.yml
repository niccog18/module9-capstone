# Local development stack. Copy .env.example to .env before running:
#   docker compose up --build
# Compose reads .env automatically for the ${...} values below.
#
# One command starts everything. On first run it also:
#   - pulls the language model (the ollama-pull service; a few minutes)
#   - creates the database tables and loads the system exercises
#   - loads ./docs into ChromaDB
# until the model download finishes, /health reports "degraded" and /ask
# answers 503; the rest of the app works.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ defers expansion to the container's own environment.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    # Local LLM server. Models are stored in the ollama_data volume, so they
    # are pulled once and survive restarts. Unpinned tag: pin a version if you
    # need reproducible builds.
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama-pull:
    # One-shot job: downloads MODEL_NAME into the ollama_data volume, then
    # exits. It does nothing when the model is already there.
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${MODEL_NAME:-llama3.2:3b}"]
    depends_on:
      ollama:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"  # includes pytest so `docker compose exec backend pytest` works
    env_file:
      - .env
    environment:
      # Container paths. These override any values in .env, which can then
      # keep local-run paths without affecting Docker.
      CHROMA_PATH: /data/chroma
      DOCS_DIRECTORY: /docs
    ports:
      - "8000:8000"
    volumes:
      # Development only: live-reload from the host. Remove this mount and
      # the --reload flag for a production deployment.
      - ./backend:/app
      - ./docs:/docs:ro
      - chroma_data:/data/chroma
      # Keeps the downloaded embedding model across container rebuilds.
      - model_cache:/home/appuser/.cache
    # Seed and ingest run to completion BEFORE the API starts (both are safe
    # to repeat). Running them first also avoids ChromaDB serving stale data
    # to an API process that was already running. A failure is logged but does
    # not stop the API from starting.
    command: >
      sh -c "python seed_exercises.py;
             python ingest_docs.py;
             exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      # Ollama is intentionally not a dependency: if it is down the API still
      # starts, /health reports "degraded", and only /ask is unavailable.
    healthcheck:
      # /health returns 503 only when the database is unreachable, which makes
      # urlopen raise and the check fail. A degraded status (Ollama or
      # ChromaDB down) still returns 200 and keeps the container healthy.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      # Seeding and ingesting run first; the first run also downloads the
      # embedding model, so allow plenty of time before checks count.
      start_period: 180s

  frontend:
    build:
      context: ./frontend
    environment:
      # The Streamlit server calls the API from inside the Compose network,
      # so the browser never calls the backend and CORS does not apply here.
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    volumes:
      # Development only: edits on the host reload the app.
      - ./frontend:/app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  ollama_data:
  chroma_data:
  model_cache: